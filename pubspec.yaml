name: devspork
description: "DevSpork"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.4+3
  crypto: ^3.0.5
  xml: ^6.5.0
  qr_flutter: ^4.1.0
  yaml_writer: ^2.0.0
  image_picker: ^1.1.2
  basic_utils: ^5.7.0
  markdown: ^7.2.2
  html: ^0.15.4
  json_schema: ^5.2.0
  bcrypt: ^1.1.3
  shared_preferences: ^2.3.2
  http: ^1.2.0
  zxcvbn: ^1.0.0
  encrypt: ^5.0.3
  shelf: ^1.4.2
  yaml: ^3.1.3
  flutter_luban: ^0.1.15
  image: ^4.8.0
  file_saver: ^0.3.1
  platform_image_converter: ^2.2.0
  heic_native: ^1.1.0
  flutter_svg: ^2.0.17
  flutter_avif: ^3.1.0
  jxl_coder: ^0.1.0
  pdf_combiner: ^6.2.1
  pdf: ^3.11.3
  pdfx: ^2.11.0
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  archive: ^4.0.5
  ffmpeg_kit_flutter_new_audio: ^2.5.2
  window_manager: ^0.5.1
  flutter_launcher_icons: ^0.14.4
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  win_plugin_link_repair: ^0.1.1

flutter:

  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/lang/az.json
    - assets/lang/en.json


flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0F0B24"
    theme_color: "#7C4DFF"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"